services:
  animedl:
    build:
      context: .
      # Build with host networking so the systemd-resolved stub (127.0.0.53)
      # on the host is reachable and apt-get can resolve deb.debian.org.
      network: host
    image: animedl:latest
    container_name: animedl
    restart: unless-stopped
    # Containers can't reach the host's 127.0.0.53 stub resolver, so pin
    # public resolvers for runtime DNS (pip, megatools, episode sources, etc.).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      # Los vídeos se crean con este usuario/grupo (ejecuta `id` para ver los tuyos)
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Madrid}
      # Cuándo buscar episodios nuevos (cron: minuto hora día mes día-semana). Lunes 04:00.
      ANIMEDL_SCHEDULE: ${ANIMEDL_SCHEDULE:-0 4 * * 1}
      # Episodios que se descargan a la vez
      ANIMEDL_PARALLEL_DOWNLOADS: ${ANIMEDL_PARALLEL_DOWNLOADS:-3}
    volumes:
      - ./data:/data                                # base de datos y config.toml opcional
      - ${SERIES_DIR:-./downloads/Series}:/series     # biblioteca de series de Plex/Jellyfin
      - ${MOVIES_DIR:-./downloads/Peliculas}:/movies  # biblioteca de películas
      # Solo para `animedl rename` de lo descargado con versiones anteriores (ANIME_DIR).
      # Cuando ya no quede nada dentro puedes borrar esta línea.
      - ${ANIME_DIR:-./downloads}:/downloads
    command: ["daemon"]
