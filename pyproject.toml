[project]
name = "animedl"
version = "0.1.0"
description = "Descarga series de anime desde webs de streaming y vigila los nuevos episodios."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12",
    "curl-cffi>=0.7",
    "lxml>=5.0",
    "rich>=13.0",
    "typer>=0.12",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
animedl = "animedl.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animedl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is handled by `ruff format`
